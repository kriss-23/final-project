<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LeadPredictor campaign performance dashboard"
    />
    <title>LeadPredictor Dashboard</title>
    <style>
:root {
  color-scheme: dark;
  --page-background: #111c2b;
  --panel-background: #1a2738;
  --panel-soft: #202f42;
  --field-background: #243449;
  --border: #2d4056;
  --text: #f3f6fb;
  --muted-text: #aab6c6;
  --accent: #c5d0df;
  --track: #52647a;
  --shadow: 0 18px 45px rgb(4 10 18 / 20%);
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: var(--page-background);
}

body {
  min-height: 100vh;
  margin: 0;
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px;
  background:
    radial-gradient(circle at 75% 12%, rgb(48 74 102 / 18%), transparent 36rem),
    linear-gradient(135deg, #172436 0%, var(--page-background) 55%, #152234 100%);
}

button,
input,
select {
  font: inherit;
}

.app-shell {
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr);
  gap: 20px;
  width: min(calc(100% - 32px), 1240px);
  min-height: 100vh;
  margin: 0 auto;
  padding: 28px 0;
}

.sidebar,
.chart-card,
.response-card {
  border: 1px solid var(--border);
  background: rgb(27 41 58 / 82%);
  box-shadow: var(--shadow);
}

.sidebar {
  align-self: start;
  min-height: 660px;
  padding: 18px 18px 22px;
  border-radius: 11px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 28px;
  color: var(--muted-text);
  font-size: 19px;
  font-weight: 700;
  text-decoration: none;
}

.brand-mark {
  display: grid;
  width: 19px;
  height: 19px;
  place-items: center;
  color: var(--panel-background);
  font-size: 10px;
  background: var(--accent);
  border-radius: 4px;
}

.campaign-form {
  display: grid;
  gap: 17px;
}

.field-group {
  display: grid;
  gap: 7px;
}

label {
  color: var(--muted-text);
  font-size: 11px;
  font-weight: 600;
}

input,
select {
  width: 100%;
  min-height: 36px;
  padding: 0 10px;
  color: var(--text);
  border: 1px solid #34485f;
  border-radius: 5px;
  outline: none;
  background: var(--field-background);
}

input::placeholder {
  color: var(--text);
  opacity: 0.85;
}

input:focus,
select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgb(197 208 223 / 18%);
}

.dashboard {
  display: grid;
  align-content: start;
  gap: 20px;
}

.chart-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 220px;
  gap: 20px;
  min-height: 440px;
  padding: 20px;
  border-radius: 11px;
}

.campaign-chart {
  display: grid;
  grid-template-rows: auto 1fr;
  min-height: 390px;
  overflow: hidden;
  border: 1px solid rgb(74 96 120 / 28%);
  border-radius: 7px;
  background:
    linear-gradient(rgb(103 127 153 / 12%) 1px, transparent 1px),
    linear-gradient(90deg, rgb(103 127 153 / 12%) 1px, transparent 1px);
  background-size: 68px 52px;
}

.chart-heading {
  display: flex;
  justify-content: space-between;
  align-items: start;
  padding: 16px 16px 0 18px;
}

.chart-title {
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
}

.chart-heading p {
  margin: 4px 0 0;
  color: var(--muted-text);
  font-size: 11px;
}

.chart-unit {
  color: var(--muted-text);
  font-size: 10px;
}

.chart-plot {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr);
  gap: 10px;
  align-items: stretch;
  min-height: 300px;
  padding: 20px 18px 18px 14px;
}

.y-axis {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding-bottom: 23px;
  color: var(--muted-text);
  font-size: 9px;
  text-align: right;
}

.bar-chart {
  display: flex;
  align-items: end;
  justify-content: space-around;
  gap: 12%;
  min-width: 0;
  border-bottom: 1px solid rgb(170 183 199 / 36%);
}

.bar-group {
  display: grid;
  grid-template-rows: 18px minmax(0, 1fr) 22px;
  align-items: end;
  width: min(24%, 90px);
  height: 100%;
  color: var(--muted-text);
  font-size: 10px;
  text-align: center;
}

.bar-group > span {
  align-self: end;
  white-space: nowrap;
}

.bar-value {
  color: var(--text);
  font-size: 11px;
  font-weight: 700;
}

.bar {
  width: 100%;
  height: var(--bar-height);
  min-height: 8px;
  border-radius: 4px 4px 0 0;
  box-shadow: inset 0 1px rgb(255 255 255 / 30%);
  transition: filter 160ms ease, transform 160ms ease;
}

.bar:hover {
  filter: brightness(1.15);
  transform: translateY(-2px);
}

.bar-prospects {
  background: linear-gradient(90deg, #9eacbc, #d2dae5);
}

.bar-leads {
  background: linear-gradient(90deg, #78899d, #aebdce);
}

.bar-customers {
  background: linear-gradient(90deg, #61758b, #91a5ba);
}

.metric-stack {
  display: grid;
  align-content: start;
  gap: 17px;
}

.metric-card {
  display: grid;
  grid-template-columns: 25px 1fr;
  min-width: 0;
  gap: 8px;
  padding: 11px;
  border: 1px solid #425267;
  border-radius: 6px;
  background: linear-gradient(135deg, #77869a, #aab5c3);
  color: #fff;
}

.metric-icon {
  color: #edf2f7;
  font-size: 15px;
}

.metric-card p {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin: 0 0 3px;
  font-size: 11px;
}

.metric-card p strong,
.metric-value {
  min-width: 0;
  overflow-wrap: anywhere;
}

.metric-value {
  display: block;
  font-size: 21px;
  line-height: 1.1;
}

.metric-progress {
  grid-column: 1 / -1;
  height: 7px;
  margin-top: 3px;
  overflow: hidden;
  border-radius: 99px;
  background: #415166;
}

.metric-progress span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: #f6f8fb;
}

.response-card {
  display: grid;
  gap: 23px;
  padding: 18px 22px 20px;
  border-radius: 11px;
}

.range-row {
  display: grid;
  gap: 8px;
}

.range-label {
  display: flex;
  justify-content: space-between;
  color: var(--muted-text);
  font-size: 11px;
}

.range-track {
  position: relative;
  height: 7px;
  border-radius: 99px;
  background: var(--track);
}

.response-rate-input {
  width: 100%;
  min-height: 7px;
  padding: 0;
  accent-color: var(--accent);
  cursor: pointer;
}

.range-thumb {
  position: absolute;
  top: 50%;
  width: 15px;
  height: 15px;
  border: 2px solid #aeb9c8;
  border-radius: 50%;
  background: #f4f6fa;
  transform: translate(-50%, -50%);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

@media (max-width: 800px) {
  .app-shell {
    grid-template-columns: 1fr;
    padding: 16px 0;
  }

  .sidebar {
    min-height: auto;
  }

  .chart-card {
    grid-template-columns: 1fr;
  }

  .campaign-chart {
    min-height: 280px;
  }

  .metric-stack {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .response-card {
    gap: 18px;
  }
}

@media (max-width: 620px) {
  .app-shell {
    width: min(calc(100% - 20px), 480px);
  }

  .sidebar {
    padding: 16px;
  }

  .brand {
    margin-bottom: 20px;
  }

  .campaign-form {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px 12px;
  }

  .chart-card {
    gap: 14px;
    padding: 14px;
  }

  .metric-stack {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .metric-card {
    grid-template-columns: 28px minmax(0, 1fr);
    padding: 12px;
  }

  .response-card {
    padding: 16px;
  .chart-plot {
    min-height: 200px;
  }
}

@media (max-width: 480px) {
  .app-shell {
    width: calc(100% - 16px);
    padding: 8px 0;
  }

  .campaign-form {
    grid-template-columns: 1fr;
  }

  .chart-card {
    padding: 10px;
  }

  .response-card {
    padding: 14px 12px 16px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }

  .chart-card {
    padding: 12px;
  }

  .chart-plot {
    padding-right: 10px;
    padding-left: 8px;
  }

  .bar-group {
    font-size: 9px;
  }
}
    
.response-rate-input {
  width: 100%;
  min-height: 7px;
  padding: 0;
  accent-color: var(--accent);
  cursor: pointer;
}</style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Campaign settings">
        <a class="brand" href="/" aria-label="LeadPredictor home">
          <span class="brand-mark" aria-hidden="true">◆</span>
          <span>LeadPredictor</span>
        </a>

        <form class="campaign-form">
          <div class="field-group">
            <label for="language">Language</label>
            <select id="language" name="language">
              <option>English</option>
            </select>
          </div>

          <div class="field-group">
            <label for="currency">Currency</label>
            <select id="currency" name="currency">
              <option>US Dollar</option>
            </select>
          </div>

          <div class="field-group">
            <label for="campaign-start">Campaign Start</label>
            <input id="campaign-start" name="campaign-start" type="date" />
          </div>

          <div class="field-group">
            <label for="campaign-end">Campaign End</label>
            <input id="campaign-end" name="campaign-end" type="date" />
          </div>

          <div class="field-group">
            <label for="total-revenue">Total Revenue</label>
            <input id="total-revenue" name="total-revenue" type="number" min="0" step="0.01" value="10000" placeholder="$ 10000" />
          </div>

          <div class="field-group">
            <label for="average-order-value">Avg. Order Value</label>
            <input
              id="average-order-value"
              name="average-order-value"
              type="text"
              placeholder="$ 1000"
            />
          </div>
        </form>
      </aside>

      <main class="dashboard">
        <section class="chart-card" aria-labelledby="campaign-overview-title">
          <div class="campaign-chart" aria-describedby="chart-description">
            <div class="chart-heading">
              <div>
                <span id="campaign-overview-title" class="chart-title">Campaign overview</span>
                <p id="chart-description">Responses by campaign stage</p>
              </div>
              <span class="chart-unit">People</span>
            </div>

            <div id="chart-plot" class="chart-plot" role="img" aria-label="Campaign overview: 125 prospects, 25 leads, and 10 customers">
              <div class="y-axis" aria-hidden="true">
                <span>125</span>
                <span>100</span>
                <span>75</span>
                <span>50</span>
                <span>25</span>
                <span>0</span>
              </div>
              <div class="bar-chart">
                <div class="bar-group">
                  <div id="prospects-bar-value" class="bar-value">125</div>
                  <div id="prospects-bar" class="bar bar-prospects" style="--bar-height: 100%"></div>
                  <span>Prospects</span>
                </div>
                <div class="bar-group">
                  <div id="leads-bar-value" class="bar-value">25</div>
                  <div id="leads-bar" class="bar bar-leads" style="--bar-height: 20%"></div>
                  <span>Leads</span>
                </div>
                <div class="bar-group">
                  <div id="customers-bar-value" class="bar-value">10</div>
                  <div id="customers-bar" class="bar bar-customers" style="--bar-height: 8%"></div>
                  <span>Customers</span>
                </div>
              </div>
            </div>
          </div>

          <div class="metric-stack" aria-label="Campaign metrics">
            <article class="metric-card">
              <span class="metric-icon" aria-hidden="true">▣</span>
              <div>
                <p>Prospects <strong id="prospects-percentage">100%</strong></p><strong id="prospects-value" class="metric-value">125</strong>
              </div>
              <div class="metric-progress"><span style="width: 100%"></span></div>
            </article>

            <article class="metric-card">
              <span class="metric-icon" aria-hidden="true">♟</span>
              <div>
                <p>Leads <strong id="leads-percentage">20%</strong></p><strong id="leads-value" class="metric-value">25</strong>
              </div>
              <div class="metric-progress"><span style="width: 20%"></span></div>
            </article>

            <article class="metric-card">
              <span class="metric-icon" aria-hidden="true">⌛</span>
              <div>
                <p>Customers <strong id="customers-percentage">8%</strong></p><strong id="customers-value" class="metric-value">10</strong>
              </div>
              <div class="metric-progress"><span style="width: 8%"></span></div>
            </article>
          </div>
        </section>

        <section class="response-card" aria-labelledby="response-rates-title">
          <h2 id="response-rates-title" class="sr-only">Response rates</h2>
          <div class="range-row">
            <div class="range-label">
              <span>Lead Response Rate</span>
              <span id="lead-response-rate-value">40.00%</span>
            </div>
            <input id="lead-response-rate" class="response-rate-input" type="range" min="0.01" max="100" step="0.01" value="40" aria-label="Lead response rate" />
          </div>
          <div class="range-row">
            <div class="range-label">
              <span>Prospect Response Rate</span>
              <span id="prospect-response-rate-value">20.00%</span>
            </div>
            <input id="prospect-response-rate" class="response-rate-input" type="range" min="0.01" max="100" step="0.01" value="20" aria-label="Prospect response rate" />
          </div>
        </section>
      </main>
    </div>

    <script>
"use strict";

const form = document.querySelector(".campaign-form");
const revenueInput = document.querySelector("#total-revenue");
const averageOrderValueInput = document.querySelector("#average-order-value");
const leadResponseRateInput = document.querySelector("#lead-response-rate");
const prospectResponseRateInput = document.querySelector("#prospect-response-rate");
const chartPlot = document.querySelector("#chart-plot");

const metrics = {
  prospects: {
    value: document.querySelector("#prospects-value"),
    barValue: document.querySelector("#prospects-bar-value"),
    bar: document.querySelector("#prospects-bar"),
    percentage: document.querySelector("#prospects-percentage"),
    progress: document.querySelector("#prospects-value").closest(".metric-card").querySelector(".metric-progress span"),
  },
  leads: {
    value: document.querySelector("#leads-value"),
    barValue: document.querySelector("#leads-bar-value"),
    bar: document.querySelector("#leads-bar"),
    percentage: document.querySelector("#leads-percentage"),
    progress: document.querySelector("#leads-value").closest(".metric-card").querySelector(".metric-progress span"),
  },
  customers: {
    value: document.querySelector("#customers-value"),
    barValue: document.querySelector("#customers-bar-value"),
    bar: document.querySelector("#customers-bar"),
    percentage: document.querySelector("#customers-percentage"),
    progress: document.querySelector("#customers-value").closest(".metric-card").querySelector(".metric-progress span"),
  },
};

const responseRateValues = {
  leads: document.querySelector("#lead-response-rate-value"),
  prospects: document.querySelector("#prospect-response-rate-value"),
};

const formatNumber = (value) =>
  new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 }).format(value);

const readPositiveNumber = (input) => {
  const value = Number.parseFloat(input.value);
  return Number.isFinite(value) && value > 0 ? value : null;
};

const updateMetric = (metric, value, percentage, maxValue) => {
  const formattedValue = formatNumber(value);
  metric.value.textContent = formattedValue;
  metric.barValue.textContent = formattedValue;
  metric.percentage.textContent = `${formatNumber(percentage)}%`;
  metric.bar.style.setProperty("--bar-height", `${Math.max((value / maxValue) * 100, 1)}%`);
  metric.progress.style.width = `${Math.max((value / maxValue) * 100, 1)}%`;
};

const updateDashboard = () => {
  const revenue = readPositiveNumber(revenueInput);
  const averageOrderValue = readPositiveNumber(averageOrderValueInput);
  const leadResponseRate = readPositiveNumber(leadResponseRateInput);
  const prospectResponseRate = readPositiveNumber(prospectResponseRateInput);

  if (!revenue || !averageOrderValue || !leadResponseRate || !prospectResponseRate) {
    return;
  }

  // Formula 01: customers = revenue / average order value.
  const customers = revenue / averageOrderValue;
  // Formula 02: leads = customers * 100 / lead response rate.
  const leads = (customers * 100) / leadResponseRate;
  // Formula 03: prospects = leads * 100 / prospect response rate.
  const prospects = (leads * 100) / prospectResponseRate;
  const maxValue = Math.max(prospects, 1);

  updateMetric(metrics.prospects, prospects, 100, maxValue);
  updateMetric(metrics.leads, leads, (leads / prospects) * 100, maxValue);
  updateMetric(metrics.customers, customers, (customers / prospects) * 100, maxValue);

  chartPlot.setAttribute(
    "aria-label",
    `Campaign overview: ${formatNumber(prospects)} prospects, ${formatNumber(leads)} leads, and ${formatNumber(customers)} customers`,
  );
  responseRateValues.leads.textContent = `${Number(leadResponseRate).toFixed(2)}%`;
  responseRateValues.prospects.textContent = `${Number(prospectResponseRate).toFixed(2)}%`;
};

form.addEventListener("input", updateDashboard);
leadResponseRateInput.addEventListener("input", updateDashboard);
prospectResponseRateInput.addEventListener("input", updateDashboard);
updateDashboard();
    </script>
  </body>
</html>
